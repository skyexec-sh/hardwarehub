spring:
  datasource:
    url: jdbc:h2:mem:hardwarehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

hardwarehub:
  security:
    jwt:
      secret: TestSecretKeyForHardwareHubJwtMustBeLongEnough123456
      access-token-expiration-ms: 60000
      refresh-token-expiration-ms: 3600000
    cors:
      allowed-origins: http://localhost:4200
