<div class="auth-page solo">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Reset password</h2>
    <p class="hint">Paste the reset token from the server log (Milestone 1 stub).</p>
    <label>
      Reset token
      <input formControlName="token" />
    </label>
    <label>
      New password
      <input type="password" formControlName="newPassword" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" class="submit">Update password</button>
    <a routerLink="/login" class="link">Back to login</a>
  </form>
</div>
