# Free cloud deploy: Render (API) + Neon (Postgres)
# Frontend is served from GitHub Pages (see .github/workflows/deploy-pages.yml).

services:
  - type: web
    name: hardwarehub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://skyexec-sh.github.io
