spring:
  application:
    name: hardwarehub-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hardwarehub}
    username: ${DATABASE_USERNAME:hardwarehub}
    password: ${DATABASE_PASSWORD:hardwarehub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

hardwarehub:
  security:
    jwt:
      secret: ${JWT_SECRET:HardwareHubDevSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hardwarehub: DEBUG
