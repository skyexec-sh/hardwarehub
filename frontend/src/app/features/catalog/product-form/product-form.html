<div class="hh-panel form-panel">
  <h2>{{ isEdit() ? 'Edit product' : 'Create product' }}</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <div class="row">
      <label>
        SKU
        <input formControlName="sku" />
      </label>
      <label>
        Barcode
        <input formControlName="barcode" />
      </label>
    </div>
    <label>
      Product name
      <input formControlName="name" />
    </label>
    <label>
      Description
      <input formControlName="description" />
    </label>
    <div class="row">
      <label>
        Category
        <select formControlName="categoryId">
          <option value="">No category</option>
          @for (c of categories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </label>
      <label>
        Brand
        <select formControlName="brandId">
          <option value="">No brand</option>
          @for (b of brands(); track b.id) {
            <option [value]="b.id">{{ b.name }}</option>
          }
        </select>
      </label>
    </div>
    <div class="row">
      <label>
        Unit
        <input formControlName="unit" />
      </label>
      <label>
        Image URL
        <input formControlName="imageUrl" />
      </label>
    </div>
    <div class="row">
      <label>
        Cost price
        <input type="number" step="0.01" formControlName="costPrice" />
      </label>
      <label>
        Selling price
        <input type="number" step="0.01" formControlName="sellingPrice" />
      </label>
    </div>
    <div class="row">
      <label>
        Current stock
        <input type="number" step="0.001" formControlName="currentStock" [readonly]="isEdit()" />
        @if (isEdit()) {
          <small class="hint">Change stock via Inventory movements</small>
        }
      </label>
      <label>
        Minimum stock
        <input type="number" step="0.001" formControlName="minimumStock" />
      </label>
    </div>
    <label>
      Maximum stock
      <input type="number" step="0.001" formControlName="maximumStock" />
    </label>
    <label class="check">
      <input type="checkbox" formControlName="active" />
      Active
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <div class="actions">
      <a routerLink="/products" class="ghost">Cancel</a>
      <button type="submit" class="save">Save</button>
    </div>
  </form>
</div>
