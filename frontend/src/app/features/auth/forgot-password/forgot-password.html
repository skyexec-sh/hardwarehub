<div class="auth-page solo">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Forgot password</h2>
    <p class="hint">If the account exists, a reset token will be prepared (email stubbed in Milestone 1).</p>
    <label>
      Email
      <input type="email" formControlName="email" />
    </label>
    @if (message()) {
      <p class="ok">{{ message() }}</p>
    }
    <button type="submit" class="submit">Send reset link</button>
    <a routerLink="/login" class="link">Back to login</a>
  </form>
</div>
