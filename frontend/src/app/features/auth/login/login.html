<div class="auth-page">
  <div class="auth-left">
    <div class="brand-block">
      <div class="mark">HH</div>
      <h1>HardwareHub</h1>
      <p>Modern store operations for Philippine hardware retailers — inventory, sales, and teams in one place.</p>
    </div>
  </div>

  <div class="auth-right">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Welcome back</h2>
      <p class="hint">Sign in to manage your store</p>

      <label>
        Username
        <input formControlName="username" autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" class="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

      <a routerLink="/forgot-password" class="link">Forgot password?</a>
    </form>
  </div>
</div>
