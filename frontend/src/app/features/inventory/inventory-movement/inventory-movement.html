<div class="hh-panel form-panel">
  <h2>Record inventory movement</h2>
  <p class="page-subtitle">{{ quantityHint() }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <label>
      Movement type
      <select formControlName="transactionType">
        @for (t of types; track t) {
          <option [value]="t">{{ t === 'STOCK_IN' ? 'Stock in' : t === 'STOCK_OUT' ? 'Stock out' : 'Adjustment' }}</option>
        }
      </select>
    </label>

    <label>
      Product
      <select formControlName="productId">
        <option value="0" disabled>Select a product</option>
        @for (p of products(); track p.id) {
          <option [value]="p.id">{{ p.sku }} — {{ p.name }} (stock: {{ p.currentStock }} {{ p.unit }})</option>
        }
      </select>
    </label>

    @if (selected(); as p) {
      <p class="page-subtitle">
        Current stock: <strong>{{ p.currentStock }} {{ p.unit }}</strong>
        · Min: {{ p.minimumStock }}
        @if (p.lowStock) {
          · <span class="error">Low stock</span>
        }
      </p>
    }

    <div class="row">
      <label>
        Quantity
        <input type="number" step="0.001" formControlName="quantity" />
      </label>
      <label>
        Unit cost (optional)
        <input type="number" step="0.01" formControlName="unitCost" />
      </label>
    </div>

    <label>
      Reference no.
      <input formControlName="referenceNo" placeholder="PO / DO / ticket #" />
    </label>

    <label>
      Notes
      <input formControlName="notes" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <a routerLink="/inventory" class="ghost">Cancel</a>
      <button type="submit" class="save">Save movement</button>
    </div>
  </form>
</div>
