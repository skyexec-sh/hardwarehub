name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - pr/hardwarehub-m8
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Set repository variable API_BASE_URL to your free API origin (e.g. https://hardwarehub-api.onrender.com)."
            exit 1
          fi
          # strip trailing slash
          API_BASE_URL="${API_BASE_URL%/}"
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Inject API URL for GitHub Pages build
        run: |
          sed -i "s|__API_BASE_URL__|${API_BASE_URL}|g" src/environments/environment.github-pages.ts
          cat src/environments/environment.github-pages.ts

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages

      - name: SPA fallback for GitHub Pages
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
