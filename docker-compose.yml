services:
  postgres:
    image: postgres:16-alpine
    container_name: hardwarehub-postgres
    environment:
      POSTGRES_DB: hardwarehub
      POSTGRES_USER: hardwarehub
      POSTGRES_PASSWORD: hardwarehub
    ports:
      - "5432:5432"
    volumes:
      - hardwarehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardwarehub -d hardwarehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: hardwarehub-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/hardwarehub
      DATABASE_USERNAME: hardwarehub
      DATABASE_PASSWORD: hardwarehub
      JWT_SECRET: HardwareHubDevSecretKeyMustBeAtLeast256BitsLongForHS256!!
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8088
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: hardwarehub-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  hardwarehub_pgdata:
