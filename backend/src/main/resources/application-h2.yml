# Local profile for machines without Docker/PostgreSQL (Milestone 1 smoke testing only).
# Prefer PostgreSQL via docker compose for normal development.
spring:
  datasource:
    url: jdbc:h2:mem:hardwarehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

hardwarehub:
  security:
    cors:
      allowed-origins: http://localhost:4200,http://localhost:8088
